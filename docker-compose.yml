# Local three-service Curalink development stack.

services:
  api-python:
    build:
      context: .
      dockerfile: backend-python/Dockerfile
    env_file: backend-python/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  api-node:
    build:
      context: .
      dockerfile: backend-node/Dockerfile
    env_file: backend-node/.env
    environment:
      FASTAPI_URL: "http://api-python:8000"
    ports:
      - "4000:4000"
    depends_on:
      - api-python
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:4000"
    ports:
      - "5173:80"
    depends_on:
      - api-node
    restart: unless-stopped
